# Workflow Name
name: My First GitHub Actions Workflow

# When workflow should run
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

# Jobs
jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print First Message
        run: echo "Hello, GitHub Actions!"

      - name: Print Build Message
        run: echo "Build completed successfully!"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Print Deployment Message
        run: echo "Deployment job started!"

      - name: Print Success Message
        run: echo "Demo workflow completed!"
